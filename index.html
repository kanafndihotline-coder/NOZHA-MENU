<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@400;700;900&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--gd:#2a1a12;--g:#3d2618;--gm:#5a3a26;--p:#b07a3a;--bd:#2a1a12;--b:#3d2618;--w:#fff;--iv:#f8f6f0;color-scheme:light}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#fff;font-family:Cairo,Tahoma,sans-serif;color:var(--b);user-select:none}
body{background:#fff}
.bgmark{position:fixed;inset:0;z-index:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.bgmark-ar{font:700 32vw/1 "Aref Ruqaa",serif;color:rgba(61,38,24,.055);white-space:nowrap}
.bgmark-en{font:700 3vw/1 Cairo;letter-spacing:.4em;color:rgba(61,38,24,.055);margin-top:1vw}
.dust{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.dust i{position:absolute;bottom:-10px;width:5px;height:5px;border-radius:50%;background:var(--p);opacity:0;animation:rise linear infinite}
@keyframes rise{10%{opacity:.35}100%{transform:translateY(-105vh) translateX(30px);opacity:0}}
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:30;text-align:center;padding-top:2px}
.brand{display:flex;justify-content:center;align-items:center;gap:8px}
.brand h1{font:700 44px/1.1 "Aref Ruqaa",serif;color:var(--b)}
.brand small{display:block;font:700 11px Cairo;letter-spacing:.32em;color:var(--p);margin-top:-4px}
.branch{display:inline-block;margin-top:3px;padding:2px 20px;border-radius:99px;background:var(--b);color:#fff;font:900 15px Cairo;letter-spacing:.02em}
#bar .addr{display:flex;flex-direction:column;align-items:center;gap:1px;margin:5px 0;text-decoration:none;color:#fff}
#bar .addr span{font:700 11px Cairo}#bar .addr span:last-child{font-size:9px;letter-spacing:.02em;opacity:.75;direction:ltr;font-weight:600}
#car{z-index:2;position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 104px);bottom:calc(env(safe-area-inset-bottom,0px) + 150px);perspective:1000px;touch-action:pan-y;cursor:grab}
.card{position:absolute;left:50%;top:50%;width:290px;padding:0;border-radius:24px;overflow:hidden;background:#fff;border:1px solid rgba(61,38,24,.12);box-shadow:0 24px 48px rgba(42,26,18,.18),0 2px 6px rgba(42,26,18,.08);will-change:transform,opacity;visibility:hidden}
.in{position:relative;background:var(--w);border-radius:26px;overflow:hidden;color:var(--b);text-align:center}
.in img{display:block;width:100%;aspect-ratio:1;object-fit:cover;pointer-events:none}
.tx{padding:12px 16px 16px;border-top:3px solid var(--b)}
h2{font:900 25px/1.3 Cairo}h3{font:700 17px "Cormorant Garamond",serif;color:var(--gm);letter-spacing:.03em}
.sz{display:flex;gap:6px;justify-content:center;margin:9px 0 6px}
.sz button{flex:1;font:700 14px Cairo;padding:5px 2px;border:1.5px solid var(--b);border-radius:12px;background:#fff;color:var(--b);cursor:pointer;transition:.35s cubic-bezier(.3,1.6,.5,1)}
.sz small{display:block;font-size:10px;opacity:.7}
.sz button:hover{background:#f6efe9}.sz button[aria-pressed=true]{background:var(--b);color:#fff;border-color:var(--b);transform:scale(1.05);box-shadow:0 6px 14px rgba(61,38,24,.3)}
.pr{font-size:15px}.pr b{font:900 28px Cairo;color:var(--b)}
#dots{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 118px);z-index:20;display:flex;justify-content:center;gap:8px;align-items:center}
#dots button{width:9px;height:9px;border-radius:9px;border:0;background:rgba(61,38,24,.2);transition:.3s;cursor:pointer}
#dots button.on{width:26px;background:var(--b)}
.ar{display:none;position:fixed;top:55%;z-index:20;width:44px;height:44px;border-radius:50%;border:1px solid rgba(61,38,24,.3);background:#fff;color:var(--b);box-shadow:0 4px 12px rgba(42,26,18,.15);font-size:22px;cursor:pointer;transition:.25s}
.ar:disabled{opacity:.25;pointer-events:none;box-shadow:none}
@media(min-width:700px){.ar{display:block}}
.lb{position:fixed;inset:0;z-index:60;background:rgba(20,12,8,.92);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.25s}
.lb.on{opacity:1;pointer-events:auto}
.lb img{max-width:92vw;max-height:82vh;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);transform:scale(.92);transition:.25s}
.lb.on img{transform:scale(1)}
.lb button{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:var(--b);font-size:18px;cursor:pointer}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(90deg,var(--gd),var(--g));border-top:3px solid var(--p);color:#fff;text-align:center;font-weight:900;font-size:14px;box-shadow:0 -8px 24px rgba(42,26,18,.25)}
#bar .promo b{background:#fff;color:var(--b);padding:0 9px;border-radius:99px;margin:0 2px}
#bar .ct{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:6px;direction:rtl}
#bar .ct a{display:inline-flex;align-items:center;gap:6px;padding:6px 18px;border-radius:99px;text-decoration:none;white-space:nowrap;font:900 17px Cairo}
#bar .hot{background:#fff;color:var(--b)}#bar .web{border:1.5px solid rgba(255,255,255,.75);color:#fff;font-weight:700;direction:ltr}
</style>
</head>
